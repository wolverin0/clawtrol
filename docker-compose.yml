services:
  clawdeck:
    image: "${CLAWTROL_IMAGE:?Set CLAWTROL_IMAGE to the exact SHA-tagged release image}"
    pull_policy: always
    ports:
      - "${CLAWTROL_BIND_ADDRESS:-0.0.0.0}:${CLAWTROL_PORT:-4001}:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in the host-side runtime environment}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in the host-side runtime environment}"
      APP_BASE_URL: "${APP_BASE_URL:?Set APP_BASE_URL to the private-LAN ClawTrol URL}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?Set ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY in the host-side runtime environment}"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?Set ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY in the host-side runtime environment}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?Set ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT in the host-side runtime environment}"
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
    restart: unless-stopped
    volumes:
      - storage:/app/storage
    networks:
      - clawdeck-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  storage:

networks:
  clawdeck-network:
    driver: bridge
